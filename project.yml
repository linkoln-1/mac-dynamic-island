name: PersonalIsland
options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  PersonalIsland:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Support/PersonalIsland.entitlements
    sources:
      - App
      - Island
      - Modules
      - Shared
      - path: Support/AppIcon.icns
        buildPhase: resources
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
      - path: Vendor/MediaRemoteAdapter/MediaRemoteAdapterTestClient
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: PersonalIslandAgentHook
        embed: false
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: false
    info:
      path: Support/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "PersonalIsland uses automation access only to read and control media playing in your browser or music apps when macOS Now Playing does not expose the session reliably."
        CFBundleDisplayName: PersonalIsland
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        CFBundleLocalizations: [en, ru]
        NSHumanReadableCopyright: ""
        SUFeedURL: "https://raw.githubusercontent.com/linkoln-1/mac-dynamic-island/main/appcast.xml"
        SUPublicEDKey: "V4yfTRdmoe20PNhO4oLRpIP6vW+l9iafIxg0z/hh8uU="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lincode.PersonalIsland
        PRODUCT_NAME: PersonalIsland
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed agent hook helper
        script: |
          cp "${BUILT_PRODUCTS_DIR}/personal-island-agent-hook" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/personal-island-agent-hook"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/personal-island-agent-hook
  PersonalIslandAgentHook:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - AgentHookHelper
      - path: Modules/Agents/AgentWire.swift
    settings:
      base:
        PRODUCT_NAME: personal-island-agent-hook
        SWIFT_VERSION: "5.0"
  PersonalIslandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/PersonalIslandTests
    dependencies:
      - target: PersonalIsland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lincode.PersonalIslandTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PersonalIsland.app/Contents/MacOS/PersonalIsland
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PersonalIsland:
    build:
      targets:
        PersonalIsland: all
        PersonalIslandTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PersonalIslandTests
